<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>브랜드 AS 관리</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23212121'/%3E%3Ctext x='16' y='21' font-family='Arial, sans-serif' font-size='13' font-weight='800' fill='white' text-anchor='middle'%3EAS%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div id="login-screen">
  <div id="login-card">
    <div class="hero-meta mono"><span>AS / BRAND AFTER-SERVICE</span><span class="js-today"></span></div>
    <h1 class="auth-heading">브랜드 AS 관리<span class="hero-dot">.</span></h1>
    <p id="login-sub">매장 방문 AS 접수와 진행 현황을 한 곳에서. 사내 구글 계정으로 로그인해 주세요.</p>
    <div id="google-login-button"></div>
  </div>
</div>

<div id="app" style="display:none;">
  <nav id="tab-nav">
    <div id="brand-mark"><span id="brand-badge">AS</span>브랜드 AS 관리</div>
    <div id="tab-nav-links">
      <button data-tab="dashboard">대시보드</button>
      <button data-tab="intake">접수</button>
      <button data-tab="list">목록</button>
      <button data-tab="field">현장</button>
    </div>
    <div id="tab-nav-right">
      <button data-tab="settings" id="settings-tab-button" style="display:none;">어드민</button>
      <button id="logout-button">로그아웃</button>
    </div>
  </nav>
  <main>
    <div class="page-head">
      <div class="hero-meta mono"><span id="page-kicker"></span><span class="js-today"></span></div>
      <h1 class="page-title"><span id="page-title-text"></span><span class="hero-dot">.</span></h1>
    </div>
    <div id="tab-content"></div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/render.js"></script>
<script src="js/notify.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/tabs/dashboard.js"></script>
<script src="js/tabs/intake.js"></script>
<script src="js/tabs/list.js"></script>
<script src="js/tabs/field.js"></script>
<script src="js/tabs/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
